[package]
name = "libopenzilo"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
license = "MPL-2.0"
description = "Unified high-performance OpenZilo interaction library in Rust with Python and Kotlin bindings"
repository = "https://github.com/ziloai/libopenzilo"
readme = "README.md"

[lib]
name = "libopenzilo"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
uniffi = "0.31"
opus1 = { version = "0.3.0", default-features = false, features = ["std", "heap"] }
thiserror = "2"
oxideav-speex = "0.0.12"
oxideav-ogg = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
zip = { version = "9", default-features = false }
regex = "1"
time = { version = "0.3", features = ["parsing"] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[build-dependencies]
sha2 = "0.10"
