name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub Release tag (e.g. v0.2.0) to publish'
        required: true
        type: string
      target:
        description: 'Registry target to publish'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - pypi
          - maven

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export VERSION="${GITHUB_REF_NAME#v}"
          python3 -c 'import os, tomllib; assert tomllib.load(open("Cargo.toml", "rb"))["package"]["version"] == os.environ["VERSION"]'
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.8.1'
      - name: Build native Android bindings
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo build --locked --features cli
          staging="$RUNNER_TEMP/libopenzilo-android"
          mkdir -p "$staging/src/main/kotlin" "$staging/src/main/assets/libopenzilo"
          target/debug/uniffi-bindgen generate --library target/debug/liblibopenzilo.so --language kotlin --config uniffi.toml --out-dir "$staging/src/main/kotlin" --no-format
          ndk="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for triple in aarch64-linux-android x86_64-linux-android; do
            abi=x86_64
            if [[ "$triple" == aarch64-linux-android ]]; then abi=arm64-v8a; fi
            linker="CARGO_TARGET_${triple^^}_LINKER"
            env "${linker//-/_}=$ndk/${triple}26-clang" cargo build --locked --release --lib --target "$triple"
            install -D "target/$triple/release/liblibopenzilo.so" "$staging/src/main/jniLibs/$abi/liblibopenzilo.so"
          done
          cp LICENSE LICENSE-opus1 LICENSE-oxideav "$staging/src/main/assets/libopenzilo/"
          printf '<manifest />\n' > "$staging/src/main/AndroidManifest.xml"
          printf '%s\n' '-keep class com.zilo.libopenzilo.** { *; }' '-keep class com.sun.jna.** { *; }' '-keepclasseswithmembers class * extends com.sun.jna.Structure { <fields>; }' > "$staging/consumer-rules.pro"
          cat > "$staging/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "libopenzilo-android"
          EOF
          cat > "$staging/build.gradle.kts" <<'EOF'
          plugins { id("com.android.library") version "9.5.1" }
          android {
              namespace = "com.zilo.libopenzilo"
              compileSdk = 37
              ndkVersion = "28.2.13676358"
              defaultConfig { minSdk = 26; consumerProguardFiles("consumer-rules.pro") }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation("androidx.annotation:annotation:1.9.1")
              api("net.java.dev.jna:jna:5.19.1@aar")
          }
          EOF
          gradle -p "$staging" --no-daemon --max-workers=2 assembleRelease
          install -D "$staging/build/outputs/aar/libopenzilo-android-release.aar" "$RUNNER_TEMP/release/libopenzilo-android-$VERSION.aar"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: android-aar
          path: ${{ runner.temp }}/release/*.aar
          if-no-files-found: error
  python-dist:
    if: github.event_name == 'push'
    uses: ./.github/workflows/python-dist.yml

  github-release:
    if: github.event_name == 'push'
    needs: [build, python-dist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-aar
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag "libopenzilo-android-$VERSION.aar" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --title "libopenzilo $VERSION" \
            --notes "Android AAR (arm64-v8a and x86_64), Python wheels (glibc Linux x86_64 and arm64, macOS Intel and Apple Silicon, Windows x86_64), and a Python source distribution. Android consumers must include net.java.dev.jna:jna:5.19.1@aar."

  pypi:
    needs: [build, python-dist]
    if: >-
      always() && (
        (github.event_name == 'push' && needs.build.result == 'success' && needs.python-dist.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'pypi'))
      )
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download built Python distributions from workflow run
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - name: Download Python distributions from GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*.whl" --pattern "libopenzilo-*.tar.gz" --dir dist
          ls -la dist
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - name: Upload to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/*

  maven:
    needs: [build]
    if: >-
      always() && (
        (github.event_name == 'push' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'maven'))
      )
    runs-on: ubuntu-24.04
    environment: maven
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - name: Validate tag and secrets
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_IN_MEMORY_KEY SIGNING_IN_MEMORY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret $name"; exit 1; fi
          done
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Download the Android AAR from this run
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-aar
          path: aar
      - name: Download the Android AAR from the GitHub Release
        if: github.event_name == 'workflow_dispatch'
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'libopenzilo-android-*.aar' --dir aar
      - name: Assemble the Maven layout
        run: |
          cargo build --locked --features cli
          target/debug/uniffi-bindgen generate --library target/debug/liblibopenzilo.so --language kotlin --config uniffi.toml --out-dir kotlin-src --no-format
          dir="maven-staging/com/openzilo/libopenzilo-android/$VERSION"
          mkdir -p "$dir"
          cp "aar/libopenzilo-android-$VERSION.aar" "$dir/"
          jar --create --file "$dir/libopenzilo-android-$VERSION-sources.jar" -C kotlin-src .
          jar --create --file "$dir/libopenzilo-android-$VERSION-javadoc.jar" README.md LICENSE LICENSE-opus1 LICENSE-oxideav
          cat > "$dir/libopenzilo-android-$VERSION.pom" <<POM
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.openzilo</groupId>
            <artifactId>libopenzilo-android</artifactId>
            <version>$VERSION</version>
            <packaging>aar</packaging>
            <name>libopenzilo-android</name>
            <description>Unified high-performance OpenZilo interaction library for Android (Kotlin bindings and native libraries).</description>
            <url>https://github.com/ziloai/libopenzilo</url>
            <licenses>
              <license>
                <name>Mozilla Public License 2.0</name>
                <url>https://www.mozilla.org/en-US/MPL/2.0/</url>
                <distribution>repo</distribution>
              </license>
            </licenses>
            <developers>
              <developer>
                <id>ziloai</id>
                <name>OpenZilo</name>
                <url>https://openzilo.com</url>
              </developer>
            </developers>
            <scm>
              <connection>scm:git:https://github.com/ziloai/libopenzilo.git</connection>
              <developerConnection>scm:git:ssh://git@github.com/ziloai/libopenzilo.git</developerConnection>
              <url>https://github.com/ziloai/libopenzilo</url>
            </scm>
            <dependencies>
              <dependency>
                <groupId>net.java.dev.jna</groupId>
                <artifactId>jna</artifactId>
                <version>5.19.1</version>
                <type>aar</type>
                <scope>compile</scope>
              </dependency>
              <dependency>
                <groupId>androidx.annotation</groupId>
                <artifactId>annotation</artifactId>
                <version>1.9.1</version>
                <scope>runtime</scope>
              </dependency>
            </dependencies>
          </project>
          POM
      - name: Checksum, sign and bundle
        run: |
          find maven-staging \( -name 'maven-metadata*' -o -name '_remote.repositories' \) -delete
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          printf '%s\n' "$SIGNING_IN_MEMORY_KEY" | gpg --batch --import
          while IFS= read -r -d '' f; do
            md5sum "$f" | awk '{printf "%s", $1}' > "$f.md5"
            sha1sum "$f" | awk '{printf "%s", $1}' > "$f.sha1"
            sha256sum "$f" | awk '{printf "%s", $1}' > "$f.sha256"
            sha512sum "$f" | awk '{printf "%s", $1}' > "$f.sha512"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$SIGNING_IN_MEMORY_KEY_PASSWORD" --armor --detach-sign "$f"
          done < <(find maven-staging -type f \( -name '*.aar' -o -name '*.jar' -o -name '*.pom' \) -print0)
          (cd maven-staging && zip -qr "$RUNNER_TEMP/maven-bundle.zip" com)
          unzip -l "$RUNNER_TEMP/maven-bundle.zip"
      - name: Upload to Central Portal
        run: |
          TOKEN=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')
          DEPLOYMENT_ID=$(curl --fail-with-body -sS --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --form "bundle=@$RUNNER_TEMP/maven-bundle.zip;type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=libopenzilo-android-$VERSION")
          echo "Central Portal deployment ID: $DEPLOYMENT_ID"
          for i in $(seq 1 24); do
            RESPONSE=$(curl -sS --request POST --header "Authorization: Bearer $TOKEN" "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")
            STATE=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploymentState",""))')
            echo "State: $STATE"
            case "$STATE" in
              VALIDATED|PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED) echo "$RESPONSE"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Deployment still $STATE after polling; check the Central Portal."
