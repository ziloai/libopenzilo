name: Publish native bindings

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export VERSION="${GITHUB_REF_NAME#v}"
          python3 -c 'import os, tomllib; assert tomllib.load(open("Cargo.toml", "rb"))["package"]["version"] == os.environ["VERSION"]'
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.8.1'
      - name: Build native Android bindings
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo build --locked --features cli
          staging="$RUNNER_TEMP/libopenzilo-android"
          mkdir -p "$staging/src/main/kotlin" "$staging/src/main/assets/libopenzilo"
          target/debug/uniffi-bindgen generate --library target/debug/liblibopenzilo.so --language kotlin --config uniffi.toml --out-dir "$staging/src/main/kotlin" --no-format
          ndk="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for triple in aarch64-linux-android x86_64-linux-android; do
            abi=x86_64
            if [[ "$triple" == aarch64-linux-android ]]; then abi=arm64-v8a; fi
            linker="CARGO_TARGET_${triple^^}_LINKER"
            env "${linker//-/_}=$ndk/${triple}26-clang" cargo build --locked --release --lib --target "$triple"
            install -D "target/$triple/release/liblibopenzilo.so" "$staging/src/main/jniLibs/$abi/liblibopenzilo.so"
          done
          cp LICENSE LICENSE-opus1 "$staging/src/main/assets/libopenzilo/"
          printf '<manifest />\n' > "$staging/src/main/AndroidManifest.xml"
          printf '%s\n' '-keep class com.zilo.libopenzilo.** { *; }' '-keep class com.sun.jna.** { *; }' '-keepclasseswithmembers class * extends com.sun.jna.Structure { <fields>; }' > "$staging/consumer-rules.pro"
          cat > "$staging/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "libopenzilo-android"
          EOF
          cat > "$staging/build.gradle.kts" <<'EOF'
          plugins { id("com.android.library") version "9.5.1" }
          android {
              namespace = "com.zilo.libopenzilo"
              compileSdk = 37
              ndkVersion = "28.2.13676358"
              defaultConfig { minSdk = 26; consumerProguardFiles("consumer-rules.pro") }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation("androidx.annotation:annotation:1.9.1")
              api("net.java.dev.jna:jna:5.19.1@aar")
          }
          EOF
          gradle -p "$staging" --no-daemon --max-workers=2 assembleRelease
          install -D "$staging/build/outputs/aar/libopenzilo-android-release.aar" "$RUNNER_TEMP/release/libopenzilo-android-$VERSION.aar"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: android-aar
          path: ${{ runner.temp }}/release/*.aar
          if-no-files-found: error
  wheels:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
          - os: macos-15
            target: aarch64
          - os: windows-2022
            target: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - name: Install the release wheel
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python -m pip install --no-index --find-links dist "libopenzilo==$VERSION"
      - run: python tools/smoke_core.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [build, wheels]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-aar
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheels
      - run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag "libopenzilo-android-$VERSION.aar" wheels/*.whl \
            --repo "$GITHUB_REPOSITORY" --title "libopenzilo $VERSION" \
            --notes "Android AAR (arm64-v8a and x86_64) and Python wheels (Linux x86_64, macOS arm64, Windows x86_64). Android consumers must include net.java.dev.jna:jna:5.19.1@aar."
