name: Validate core artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --features cli
      - name: Generate Kotlin bindings
        run: cargo run --locked --features cli --bin uniffi-bindgen -- generate --library target/debug/liblibopenzilo.so --language kotlin --config uniffi.toml --out-dir build/bindings/kotlin --no-format
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-bindings
          path: build/bindings/kotlin
  python-dist:
    uses: ./.github/workflows/python-dist.yml
