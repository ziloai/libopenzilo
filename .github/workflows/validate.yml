name: Validate core artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  rust:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --features cli
      - name: Generate Kotlin bindings
        run: cargo run --locked --features cli --bin uniffi-bindgen -- generate --library target/debug/liblibopenzilo.so --language kotlin --config uniffi.toml --out-dir build/bindings/kotlin --no-format
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-bindings
          path: build/bindings/kotlin
  wheels:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --locked --out dist
          manylinux: auto
      - run: python -m pip install --no-index --find-links dist libopenzilo
      - run: python tools/smoke_core.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl

  wheels-hosted:
    if: vars.HOSTED_CI == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64
          - os: windows-2022
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - run: python -m pip install --no-index --find-links dist libopenzilo
      - run: python tools/smoke_core.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
