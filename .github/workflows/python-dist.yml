name: Build and test Python distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-15
            target: aarch64
          - os: macos-15-intel
            target: x86_64
          - os: windows-2022
            target: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: '2014'
      - name: Install the native wheel
        shell: bash
        run: python -m pip install --no-index dist/*.whl
      - run: python tools/smoke_core.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-dist-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - name: Build the source distribution
        run: uv build --sdist --out-dir dist
      - name: Install from the source archive
        run: python -m pip install --no-cache-dir dist/*.tar.gz
      - run: python tools/smoke_core.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
